name: CI/CD

# colon3o's build. Every push to main or beta: protocol tests on Linux, then an unsigned IPA from
# macOS, published as a GitHub Release named "<branch>-latest" (a pre-release for beta) that's
# replaced on every build. Download colon3o.ipa straight from the release, or give LiveContainer /
# SideStore its link:
#   https://github.com/iop4684/colon3o/releases/download/beta-latest/colon3o.ipa
#
# Left out from the original colon3 workflow, since this fork has no use for them: signing with a
# distribution certificate, the over-the-air install page and AltStore source on GitHub Pages,
# Discord's SDK (fetched from a private repository) and the Google Drive client ID.

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Protocol tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib headers
        run: apt-get update -qq && apt-get install -y -qq zlib1g-dev
      - name: Test SoulseekKit
        run: swift test --package-path Packages/SoulseekKit

  build:
    name: Build and publish IPA
    needs: test
    # Intel Macs while GitHub's Apple-chip ones are out of capacity (Nov 2026); back to macos-15 later.
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Work out version numbers
        id: version
        run: |
          version="$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?.*/\1/p' project.yml | head -1)"
          channel=stable
          if [[ "$GITHUB_REF" == refs/heads/beta ]]; then channel=beta; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Version $version (build $GITHUB_RUN_NUMBER, $channel)"

      - name: Use the newest Xcode on the runner
        # Xcode 26+ builds the native Liquid Glass mini player; older ones fall back to a floating pill.
        run: |
          latest="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | grep -vi beta | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project colon3.xcodeproj \
            -scheme colon3 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            COLON3_CHANNEL="${{ steps.version.outputs.channel }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/colon3.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/colon3.app Payload/
          zip -qry colon3o.ipa Payload

      - name: Publish as the branch's latest release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          tag="${GITHUB_REF_NAME}-latest"
          # The commit message comes from git, not the event payload, so it never becomes shell code.
          message="$(git log -1 --format=%s)"
          notes="Build $BUILD of colon3o $VERSION ($CHANNEL), from ${GITHUB_SHA:0:7}: $message

          Install: download colon3o.ipa below, or give LiveContainer / SideStore this link:
          https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/colon3o.ipa"
          args=()
          if [ "$CHANNEL" = beta ]; then args+=(--prerelease); fi
          # Replace the previous build: one release per branch, always the newest.
          gh release delete "$tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$tag" colon3o.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "colon3o $VERSION $CHANNEL (build $BUILD)" \
            --notes "$notes" \
            "${args[@]}"
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
